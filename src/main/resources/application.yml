server:
  port: 8080

spring:
  application:
    name: idempotent-transaction-service

  # Datasource & H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:transactiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  # H2 Web Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
        trace: false

  # JPA & Hibernate Settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Logging & Observability Configuration
logging:
  level:
    root: INFO
    com.fde.assessment: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# Custom Transaction Processing Properties
transaction:
  processing:
    max-retry-attempts: 2
    simulation:
      transient-failure-transaction-id: "TXN-2005"